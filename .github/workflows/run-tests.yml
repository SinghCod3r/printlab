name: Run Automated Tests

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:
    inputs:
      runId:
        description: 'Test Run ID to execute'
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install CUPS and System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-filters ghostscript python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: pip install pillow opencv-python scikit-image numpy

      - name: Run Test Suite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx tsx scripts/simulate-action.ts

