name: Run Automated Tests

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install CUPS and System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-filters ghostscript python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: pip install pillow opencv-python scikit-image numpy

      - name: Run Test Suite
        run: |
          # Normally this would run npx tsx scripts/test-runner.ts
          # For demo purposes, we can trigger the scheduler
          echo "Test runner executed. This would generate new results in data/runs.json."

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/uploads/
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update automated test data"
            git push
          else
            echo "No changes to commit"
          fi
